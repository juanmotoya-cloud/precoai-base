name: Atualizar preços

on:
  workflow_dispatch:       # botão "Run workflow": rode UMA vez na mão antes de ligar o agendamento
  # Agendamento DESLIGADO. Depois do primeiro teste manual bem-sucedido, descomente as 2 linhas abaixo
  # (08:17 UTC = 04:17 em Manaus; evita o início da hora):
  # schedule:
  #   - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: atualizar-precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: coletor-sefaz
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coletor-sefaz/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Validar catálogo e filtros
        run: npm test
      - name: Coletar preços na SEFAZ-AM
        run: |
          rm -rf dados/coletas
          node index.js --max-paginas=10 --pausa-ms=2000 --marcas
      - name: Simular a sincronização (não grava nada)
        run: node sincronizar-firestore.js
      - name: Enviar para o Firestore
        run: node sincronizar-firestore.js --executar
      # Nenhuma etapa apaga documentos do Firestore. A limpeza (limpar-antigos.js) é sempre manual.
