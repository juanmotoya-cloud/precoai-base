
name: Teste de coleta PreçoAí

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste-coleta:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: coletor-sefaz

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Verificar catálogo
        run: |
          test -f ../dados/catalogo-sefaz.json

      - name: Coletar amostra da SEFAZ-AM
        run: node index.js --max-paginas=1 --pausa-ms=2000

      - name: Simular sincronização
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sincronizar-firestore.js
