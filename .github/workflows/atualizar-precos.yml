
name: Atualizar preços PreçoAí

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

jobs:
  coletar-e-sincronizar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: coletor-sefaz

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Coletar preços da SEFAZ-AM
        run: node index.js --max-paginas=10 --pausa-ms=2000

      - name: Enviar dados ao Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sincronizar-firestore.js --executar
